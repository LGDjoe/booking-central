name: Publish Booking Central

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: npm run check
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static routes
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node prepare-routes.mjs
          node build-pages.mjs "$PAGES_BASE"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
