name: Check booking service

on:
  push:
    branches: [main]
    paths:
      - 'booking-service/**'
      - '.github/workflows/bookings.yml'
  pull_request:
    paths:
      - 'booking-service/**'
      - '.github/workflows/bookings.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: booking-service/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
